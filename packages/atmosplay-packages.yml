method: searched
source: https://github.com/Atmosplay
notes: >-
  Atmosplay's public developer surface is its GitHub organization (github.com/Atmosplay).
  These are the first-party mobile ad SDKs and mediation adapters for the Atmosplay
  playable-ads platform. The company's websites are gone — atmosplay.com now resolves to a
  HugeDomains "for sale" parking page (every path, including every /.well-known/*, returns
  the same 44,825-byte HTML), and atmosplay.net no longer resolves at all — so the GitHub
  org is the only surviving first-party distribution channel. Repos were last pushed
  2019-12 to 2020-06, consistent with the 2018-01-01 acquisition by ZPLAY Information
  Technology. No REST API / OpenAPI is published; the integration surface is these client
  SDKs.
currency_finding: >-
  DECAY IS DOCUMENTED IN THE REGISTRIES. Only ONE Atmosplay package ever reached a public
  package registry: the iOS pod `AtmosplayAds` on CocoaPods trunk, last published
  3.2.1 on 2020-06-03 — six years stale as of this pass. The Android SDK's documented
  Gradle coordinate `com.atmosplayads:atmosplayads:3.1.0` was distributed through
  JCenter/Bintray, which JFrog shut down in 2021, and it was never migrated to Maven
  Central (https://repo1.maven.org/maven2/com/atmosplayads/ returns 404; a Maven Central
  search for `atmosplayads` returns numFound: 0). The dependency line printed in
  Atmosplay's own Android integration README is therefore no longer resolvable by any
  consumer. Every other distribution is a GitHub release/tag or bare source checkout.
