notes: >-
  Atmosplay's public developer surface is its GitHub organization (github.com/Atmosplay).
  These are the first-party mobile ad SDKs and mediation adapters for the Atmosplay
  playable-ads platform. They are distributed as source/GitHub releases (not npm/PyPI/
  Maven/CocoaPods registries). The company's websites (atmosplay.com, atmosplay.net)
  are no longer live — atmosplay.com is parked/for-sale — and the org's repos were
  last updated 2019–2020, consistent with the 2018 acquisition by ZPLAY. No REST API
  / OpenAPI is published; the integration surface is these client SDKs.
