model: test-identifier-pairs
has_hosted_sandbox: false
has_test_mode_keys: false
summary: >-
  Atmosplay published no sandbox environment, no test-vs-live key prefixes and no
  simulator/fixture tooling. What it did publish is the ad-network equivalent: fixed
  public TEST APP_ID / AD_UNIT_ID pairs, one per ad format per platform, which return
  house test creatives and — in the provider's own words — "won't generate revenue".
  These values are quoted VERBATIM from Atmosplay's own integration docs; nothing here is
  invented. There is no live counterpart to record: the Atmosplay dashboard that issued
  production IDs is offline (atmosplay.com is a parked domain), so these public test IDs
  are the only Atmosplay identifiers that remain publicly documented.
usage_note: >-
  Quoted from the docs: "You can use the following testing id when you are testing.
  Testing id won't generate revenue. Please use official id when you release your App."
