caveat: >-
  These test IDs are documented, not verified. The Atmosplay ad server they resolved
  against was operated on infrastructure the company no longer controls; whether any of
  them still return a creative could not be established without shipping an app, which is
  outside this pipeline. Treat them as a record of what the provider published, not as a
  working sandbox.
