name: Atmosplay Ads SDK lifecycle
state: end-of-life
state_evidence: >-
  Atmosplay was acquired by ZPLAY Information Technology on 2018-01-01. Its primary domain
  atmosplay.com now serves a HugeDomains "for sale" parking page on every path and every
  subdomain; atmosplay.net does not resolve. The GitHub organization (created 2015-04-27,
  org record last updated 2019-12-16) is the only surviving first-party surface, and its
  newest push across all ten repos is 2020-06-05. No repo is archived, so GitHub gives a
  visitor no signal that the platform is dead — the parked domain is the only tell.
