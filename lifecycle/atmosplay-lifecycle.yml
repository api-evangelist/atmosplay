dependency_decay:
  - item: com.atmosplayads:atmosplayads (Android SDK)
    finding: >-
      Distributed via JCenter/Bintray, sunset by JFrog in 2021, never migrated to Maven
      Central (repo1.maven.org 404, Maven Central search numFound 0). The Gradle line in
      Atmosplay's own README no longer resolves.
  - item: MopubAdapter-AtmosplayAds-iOS / -Android
    finding: >-
      Mediates MoPub, which Twitter shut down in 2021. The adapter targets a platform that
      no longer exists.
  - item: AtmosplayAds (CocoaPods)
    finding: >-
      Still served by CocoaPods trunk, last published 3.2.1 on 2020-06-03 — the only
      Atmosplay artifact still installable from a live registry.
