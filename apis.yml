aid: atmosplay
name: Atmosplay
description: >-
  Atmosplay was a mobile advertising technology company, founded in 2014 in Budapest,
  Hungary, that built interactive 3D "playable" ads and an ad-monetization platform for
  mobile game publishers. Its ATMIQ cloud gameplay engine let users try a game inside an
  ad without installing it, and its self-serve builder produced playable creatives for 3D
  and action games. Atmosplay shipped first-party mobile SDKs (Unity, iOS, Android) plus
  AdMob and MoPub mediation adapters for publishers to integrate interstitial, banner, and
  rewarded-video formats. Speedinvest led its Series A in 2016; the company was acquired by
  ZPLAY Information Technology on 2018-01-01. Its websites (atmosplay.com / atmosplay.net)
  are no longer operational; the surviving public developer surface is its GitHub
  organization of SDK and adapter repositories. This profile is maintained for network
  completeness as an acquired/inactive portfolio lead.
